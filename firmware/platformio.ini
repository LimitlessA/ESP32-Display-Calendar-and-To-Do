; Elecrow CrowPanel ESP32 HMI, 7.0" (default) or 5.0" (ESP32-S3-WROOM-1-N4R8:
; 4 MB flash, 8 MB octal PSRAM), 800x480 RGB565 parallel LCD, GT911 capacitive touch.
; The two boards wire the LCD differently, so each has its own build:
;   pio run -e crowpanel_7inch     (default)
;   pio run -e crowpanel_5inch

[platformio]
default_envs = crowpanel_7inch

[env]
; pioarduino: Arduino 3.3 on ESP-IDF 5.5. ESP-IDF 5 can run the program from
; PSRAM, so flash writes (updates, saving settings) and Wi-Fi no longer stall
; the picture; Arduino 2 (ESP-IDF 4.4) cannot (Espressif LCD FAQ, "drift").
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP-IDF options the prebuilt Arduino libraries do not set; pioarduino then
; rebuilds those libraries with them (slow the first time). NimBLE: buffers in
; PSRAM, two connections (ESP-IDF's own NimBLE; NimBLE-Arduino, which the
; firmware uses, takes the same options from build_flags below). The rest
; saves flash for the 1.9 MB update slot.
; Write "=n" to turn an option off: PlatformIO drops lines starting with #.
custom_sdkconfig =
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_FREERTOS_HZ=1000
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
    CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
    CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    CONFIG_ESP_COREDUMP_ENABLE=n
    CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=n
    CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=y
    CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y
    CONFIG_ZB_ENABLED=n
    CONFIG_ESP_INSIGHTS_ENABLED=n
    CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
    CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=n
    CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN=y
    CONFIG_LWIP_IPV6=n
    CONFIG_ESP_WIFI_SOFTAP_SUPPORT=y
    CONFIG_ESP_WIFI_SOFTAP_SAE_SUPPORT=n
    CONFIG_ESP_WIFI_ENABLE_WPA3_OWE_STA=n
    CONFIG_BT_NIMBLE_ROLE_CENTRAL=n
    CONFIG_MBEDTLS_TLS_SERVER_AND_CLIENT=n
    CONFIG_MBEDTLS_TLS_CLIENT_ONLY=y
    CONFIG_MBEDTLS_PSK_MODES=y
    CONFIG_MBEDTLS_KEY_EXCHANGE_PSK=y
    CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_ECDSA=n
    CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_RSA=n
    CONFIG_MBEDTLS_KEY_EXCHANGE_ECJPAKE=n
    CONFIG_MBEDTLS_ECJPAKE_C=n
    CONFIG_MBEDTLS_SSL_PROTO_DTLS=n
    CONFIG_MBEDTLS_SSL_RENEGOTIATION=n
    CONFIG_MBEDTLS_CAMELLIA_C=n
    CONFIG_MBEDTLS_PEM_WRITE_C=n
    CONFIG_MBEDTLS_X509_CRL_PARSE_C=n
    CONFIG_MBEDTLS_ECP_DP_SECP192R1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_SECP224R1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_SECP521R1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_SECP192K1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_SECP224K1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_SECP256K1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_BP256R1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_BP384R1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_BP512R1_ENABLED=n
    CONFIG_ESP_WIFI_FTM_ENABLE=n
    CONFIG_LWIP_PPP_SUPPORT=n
; Libraries the Arduino core bundles that this firmware does not use.
custom_component_remove =
    espressif/esp_insights
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/rmaker_cmd_resp
    espressif/rmaker_common_events
    espressif/rmaker_console
    espressif/rmaker_system_ctrl
    espressif/rmaker_time_sync
    espressif/rmaker_work_queue
    espressif/esp_schedule
    espressif/esp_daylight
    espressif/esp-zigbee-lib
    espressif/esp-zboss-lib
    espressif/esp-modbus
    espressif/esp-sr
    espressif/esp-dl
    espressif/dl_fft
    espressif/esp-dsp
    espressif/esp_modem
    espressif/esp_new_jpeg
    espressif/network_provisioning
    espressif/qrcode
    espressif/fb_gfx
    espressif/esp_secure_cert_mgr
    espressif/libsodium
    chmorgan/esp-libhelix-mp3
    joltwallet/littlefs

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 4MB
; The build fails if the app outgrows one 1.9 MB update slot of min_spiffs.csv.
board_upload.maximum_size = 1966080
; Two 1.9 MB app slots so new firmware can be installed over Wi-Fi (OTA)
board_build.partitions = min_spiffs.csv

extra_scripts =
    pre:tools/size_opt.py
    post:tools/bin_size.py

monitor_speed = 115200
; Keep the auto-reset lines released so the monitor does not hold the board in reset
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; -O2 instead of the default -Os for faster drawing; tools/size_opt.py turns
; it back to -Os for everything but LVGL and LovyanGFX, to save flash.
; C++17 like the desktop simulator (the core defaults to C++11).
; NimBLE-Arduino brings its own Bluetooth host and reads its options from
; build flags (nimconfig.h), not from custom_sdkconfig: keep its buffers in
; PSRAM so the radio has the internal RAM, and give its task room for
; pairing (secure connections) and our scan callback.
build_unflags =
    -Os
    -std=gnu++11
build_flags =
    -O2
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DLGFX_USE_V1
    -Iinclude
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2

lib_deps =
    lovyan03/LovyanGFX@1.2.32
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.2.1
    h2zero/NimBLE-Arduino@1.4.3

[env:crowpanel_7inch]
build_flags = ${env.build_flags} -DBOARD_CROWPANEL_7

[env:crowpanel_5inch]
build_flags = ${env.build_flags} -DBOARD_CROWPANEL_5
