; Elecrow CrowPanel ESP32 5.0" HMI (ESP32-S3-WROOM-1-N4R8: 4 MB flash, 8 MB octal PSRAM)
; 800x480 RGB565 parallel LCD, GT911 capacitive touch.

[env:crowpanel_5inch]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; Two 1.9 MB app slots so new firmware can be installed over Wi-Fi (OTA)
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
upload_speed = 921600

; -O2 instead of the default -Os: faster drawing for a little more flash.
; C++17 like the desktop simulator (the core defaults to C++11).
build_unflags =
    -Os
    -std=gnu++11
build_flags =
    -O2
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DLGFX_USE_V1
    -Iinclude
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    lovyan03/LovyanGFX@1.1.16
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.2.1
