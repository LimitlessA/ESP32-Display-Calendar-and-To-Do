; Elecrow CrowPanel ESP32 5.0" HMI (ESP32-S3-WROOM-1-N4R8: 4 MB flash, 8 MB octal PSRAM)
; 800x480 RGB565 parallel LCD, GT911 capacitive touch.

[env:crowpanel_5inch]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 4MB
; The build fails if the app outgrows one 1.9 MB update slot of min_spiffs.csv.
board_upload.maximum_size = 1966080
; Two 1.9 MB app slots so new firmware can be installed over Wi-Fi (OTA)
board_build.partitions = min_spiffs.csv

extra_scripts = pre:tools/size_opt.py

monitor_speed = 115200
upload_speed = 921600

; -O2 instead of the default -Os for faster drawing; tools/size_opt.py turns
; it back to -Os for everything but LVGL and LovyanGFX, to save flash.
; C++17 like the desktop simulator (the core defaults to C++11).
build_unflags =
    -Os
    -std=gnu++11
build_flags =
    -O2
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DLGFX_USE_V1
    -Iinclude
    -DCORE_DEBUG_LEVEL=1
    ; Bluetooth for phone presence: NimBLE buffers in PSRAM, no central role
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2

lib_deps =
    lovyan03/LovyanGFX@1.1.16
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.2.1
    h2zero/NimBLE-Arduino@1.4.3
