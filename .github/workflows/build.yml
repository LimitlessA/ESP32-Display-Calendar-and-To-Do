name: Build firmware

# Every push builds the firmware for both CrowPanel sizes. The "firmware"
# artifact holds, for the 7.0" board:
#   factory.bin   - full image for the first flash over USB, written at 0x0
#   firmware.bin  - app only, for updates over Wi-Fi (setup page upload)
#   manifest.json - {version, url} the display reads to find updates
# and the same three files with a "-5inch" suffix for the 5.0" board.
# The version is <major.minor from config.h>.<build number>. Every push to main
# publishes these files as the latest GitHub release, and displays with
# auto-update on install it the next time nobody is using them.

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      # pioarduino 55.03.x needs PlatformIO Core 6.1.19 (6.2's SCons breaks it)
      - run: pip install platformio==6.1.19 esptool==4.8.1
      - name: Pick the version
        run: |
          BASE=$(sed -n 's/#define FIRMWARE_VERSION "\([0-9]*\.[0-9]*\).*"/\1/p' firmware/include/config.h)
          echo "VERSION=$BASE.${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build
        env:
          SCONSFLAGS: -k  # report every compile error in one run, not just the first
        run: |
          export PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_VERSION=\\\"$VERSION\\\""
          # The first run after the ESP-IDF libraries are rebuilt (custom_sdkconfig)
          # can stop at the final link step; a second run finishes it.
          for E in crowpanel_7inch crowpanel_5inch; do
            pio run -d firmware -e $E || pio run -d firmware -e $E
          done
          for E in crowpanel_7inch crowpanel_5inch; do
            grep -q "$VERSION" firmware/.pio/build/$E/firmware.bin || { echo "version $VERSION not in $E firmware"; exit 1; }
            SIZE=$(stat -c%s firmware/.pio/build/$E/firmware.bin)
            echo "::notice::$E firmware $SIZE of 1966080 bytes ($((SIZE * 100 / 1966080))% of an update slot, $(((1966080 - SIZE) / 1024)) KB free)"
          done
      - name: Make the factory images and manifests
        run: |
          mkdir -p dist
          for E in crowpanel_7inch crowpanel_5inch; do
            B=firmware/.pio/build/$E
            S=""; [ "$E" = crowpanel_5inch ] && S="-5inch"
            esptool.py --chip esp32s3 merge_bin -o dist/factory$S.bin \
              --flash_mode keep --flash_freq keep --flash_size 4MB \
              0x0 $B/bootloader.bin \
              0x8000 $B/partitions.bin \
              0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
              0x10000 $B/firmware.bin
            cp $B/firmware.bin dist/firmware$S.bin
            URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/firmware$S.bin"
            printf '{"version":"%s","url":"%s"}\n' "$VERSION" "$URL" > dist/manifest$S.json
            cat dist/manifest$S.json
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
      - name: Keep test builds of other branches on a builds/ branch
        # Lets a branch's firmware be fetched with plain git (no Actions login)
        # before it is merged; overwritten by every push to that branch.
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          cd dist
          git init -q -b build
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "Firmware $VERSION from ${{ github.ref_name }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "build:refs/heads/builds/${{ github.ref_name }}"
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Firmware ${{ env.VERSION }} (not yet tested on a real board)
          make_latest: true
          files: dist/*
